# ccmtc-guides — 官網共用的靜態說明站容器
# 每個說明站一個資料夾：/usr/share/nginx/html/<key>/，由 ccmtc-portal 依 src/config/sites.mjs
# 把 /<key>/... rewrite 進來。通行碼保護一律在外層 portal 的 middleware 做。
# 本容器只在 Docker 內網 expose 80，不對公網開埠。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 站掛在官網的 /<key> 底下，nginx 自動補斜線的 301 若帶絕對網址會洩漏內部位址。
    absolute_redirect off;
    autoindex off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2 application/octet-stream;

    # 根目錄不提供任何內容（只能從 /<key>/ 進來）
    location = / { return 404; }

    # 隱藏檔（建置暫存、.DS_Store）一律不給
    location ~ /\. { return 404; }

    # 0. 封存站凍結的 API 回應（無副檔名的 JSON 檔）：只允許讀取。
    location ~ ^/[a-z0-9-]+/api/ {
        limit_except GET HEAD { deny all; }
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 0b. Next.js 編譯後資源檔名含雜湊，可長期快取
    location ~ ^/[a-z0-9-]+/_next/static/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 1. 樣式與腳本：每次向伺服器確認（304 快速回應）
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 2. 圖片與字型：長效快取 30 天
    location ~* \.(woff2|jpg|jpeg|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 3. 程式檔與壓縮包：強制下載
    #    .ts 預設會被當成影片 (video/mp2t)；.hex 是 micro:bit 韌體，一律當附件。
    location ~* \.(ts|hex|zip|md|ino|tb)$ {
        types { application/zip zip; application/octet-stream hex; }
        default_type text/plain;
        charset utf-8;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 3b. 簡報檔：以附件下載，保留正確的 MIME（沿用原 squid-portal 容器的行為）
    location ~* \.pptx$ {
        add_header Content-Disposition "attachment";
        expires 7d;
        try_files $uri =404;
    }

    # 4. HTML 與其他：每次重新驗證
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        # 先找 $uri/index.html 再找 $uri/：官網 rewrite 會把「資料夾/」的結尾斜線吃掉，
        # 若讓 nginx 回 301 補斜線，導向會脫離官網的 /<站> 前綴（例：/squid/materials/ → /materials/）。
        try_files $uri $uri/index.html $uri/ =404;
    }
}
